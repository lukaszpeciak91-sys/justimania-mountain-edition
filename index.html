<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#173c36" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Bungee&display=swap" rel="stylesheet" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Justimania Mountain Edition</title>
  </head>
  <body>
    <main id="game-shell" aria-label="Justimania Mountain Edition game">
      <div id="game"></div>
    </main>
    <div id="game-over-modal" role="dialog" aria-modal="true" aria-labelledby="game-over-title" hidden>
      <div class="game-over-panel">
        <div id="game-over-title" class="game-over-title">RUN OVER</div>
        <button id="game-over-menu-button" type="button">MENU</button>
      </div>
    </div>
    <div id="victory-modal" role="dialog" aria-modal="true" aria-labelledby="victory-title" hidden>
      <div class="victory-panel">
        <div id="victory-title" class="victory-title">SUMMIT REACHED!</div>
        <div class="victory-subtitle">RYSY • 2499 m</div>
        <div id="victory-time" class="victory-time">TIME 00:00</div>
        <button id="victory-play-again-button" type="button">PLAY AGAIN</button>
        <button id="victory-menu-button" type="button">MENU</button>
      </div>
    </div>
    <div id="orientation-guard" role="alert" aria-live="assertive" hidden>
      <strong>Rotate your phone to continue</strong>
      <span>Justimania is designed for portrait play.</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
